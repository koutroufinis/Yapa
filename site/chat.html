<!DOCTYPE html>
<!--
  Yapa — chat.html
  ==================================================================
  USAGE NOTE
  ------------------------------------------------------------------
  This is a single, self-contained, dependency-free chat UI. Drop it
  into your site folder and open it at e.g. http://localhost:5000/chat.html

  Wiring to a real backend:
    - All API paths live in the CONFIG object near the top of the
      <script> block (search for "CONFIG"). Change API_BASE and/or
      the individual ENDPOINTS.* paths to match your server.
    - Expected endpoints (see spec in code comments for exact shapes):
        GET  {API_BASE}/api/contacts
        GET  {API_BASE}/api/messages?contactId=...
        POST {API_BASE}/api/messages          body: { to, text }
        POST {API_BASE}/api/profile           body: { username, avatarBase64 }
        POST {API_BASE}/api/profile/delete
        POST {API_BASE}/api/logout
    - If any request fails (network error, 404, 5xx) the app falls
      back to localStorage automatically so the UI keeps working
      offline. Sample seed data is embedded (search "SEED_DATA").
    - LOGIN_URL controls where "Log out" redirects to — defaults to
      "/login"; change it to "auth.html" if you're using the
      login/signup page shipped alongside this file.

  Testing locally without a backend:
    - Just open the file directly (or serve it) — every API call
      will fail to reach a server and the app will transparently
      use localStorage, seeded with a few sample contacts/messages.
  ==================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yapa</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Cpath d='M28 24 L50 50 L72 24' stroke='%23fff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M50 50 L50 78' stroke='%23fff' stroke-width='9' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">

<style>
  /* ================================================================
     Scoped styles. No universal (*) reset — only elements the app
     actually uses are normalized, under the .yapa-app root, so this
     file is safe to fold into a larger page later if needed.
     ================================================================ */

  html, body{ height: 100%; }
  body{ margin: 0; }

  .yapa-app{
    --bg: #0a0a0a;
    --bg-raised: #111110;
    --bg-card: #0e0e0d;
    --bg-field: #141412;
    --bg-hover: #171714;
    --border: #232320;
    --border-soft: #1a1a17;
    --fg: #faf9f4;
    --fg-dim: #8c8c85;
    --fg-faint: #55554f;
    --online: #7CFA85;
    --error: #FF8A7A;
    --unread: #faf9f4;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .yapa-app *{ box-sizing: border-box; }
  .yapa-app button, .yapa-app input, .yapa-app textarea{
    font-family: inherit;
    color: inherit;
  }
  .yapa-app button{ cursor: pointer; }
  .yapa-app .mono{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    letter-spacing: 0.01em;
  }
  .yapa-app a{ color: inherit; text-decoration: none; }

  .yapa-app :focus-visible{
    outline: 2px solid var(--fg);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .yapa-app .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce){
    .yapa-app *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- HEADER ---------- */
  .app-header{
    flex-shrink: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border-soft);
    background: rgba(10,10,10,0.9);
    z-index: 20;
  }

  .app-header .left{ display: flex; align-items: center; gap: 12px; }

  .icon-btn{
    width: 38px; height: 38px;
    border-radius: 9px;
    background: none;
    border: 1px solid transparent;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-dim);
    transition: 0.18s;
  }
  .icon-btn:hover{ background: var(--bg-raised); color: var(--fg); border-color: var(--border); }
  .icon-btn svg{ width: 20px; height: 20px; }

  .hamburger{ display: none; }

  .brand{ display: flex; align-items: center; gap: 10px; }
  .logo-mark{
    width: 30px; height: 30px;
    border-radius: 8px;
    background: #000;
    border: 1px solid #2b2b27;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg{ width: 60%; height: 60%; }
  .brand .wordmark{ font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }

  .header-user{
    display: flex; align-items: center; gap: 10px;
    background: none; border: 1px solid transparent;
    border-radius: 10px;
    padding: 5px 8px 5px 5px;
    transition: 0.18s;
  }
  .header-user:hover{ background: var(--bg-raised); border-color: var(--border); }
  .header-user .name{ font-size: 13.5px; font-weight: 600; }
  .header-user .role{ font-size: 11px; color: var(--fg-dim); }

  .avatar{
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #1c1c19;
    border: 1px solid var(--border);
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: var(--fg-dim);
  }
  .avatar img{ width: 100%; height: 100%; object-fit: cover; }
  .avatar.sm{ width: 28px; height: 28px; font-size: 11px; }
  .avatar .status-dot{
    position: absolute; bottom: -1px; right: -1px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--online);
    border: 2px solid var(--bg);
    display: none;
  }
  .avatar.online .status-dot{ display: block; }

  /* ---------- MAIN LAYOUT ---------- */
  .app-main{
    flex: 1;
    display: flex;
    min-height: 0;
    position: relative;
  }

  /* ---------- SIDEBAR / CONTACTS ---------- */
  .sidebar{
    width: 320px;
    flex-shrink: 0;
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    min-height: 0;
  }

  .sidebar-search{
    padding: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  .find-row{
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .sidebar-search input{
    flex: 1;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 13.5px;
    min-width: 0;
  }
  .sidebar-search input::placeholder{ color: var(--fg-faint); }
  .find-btn{
    border: 1px solid var(--border);
    background: var(--fg);
    color: #000;
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .team-section{
    border-top: 1px solid var(--border-soft);
    padding: 12px 12px 8px;
    background: rgba(255,255,255,0.01);
  }

  .team-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .team-label{
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .team-add-btn{
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--fg);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .team-editor{
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .team-avatar-edit{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .team-avatar-edit .avatar{ width: 42px; height: 42px; font-size: 12px; }
  .team-avatar-edit .upload-btn{
    font-size: 12px;
    border: 1px solid var(--border);
    padding: 7px 10px;
    border-radius: 8px;
    color: var(--fg-dim);
    display: inline-block;
    cursor: pointer;
    transition: 0.18s;
  }
  .team-avatar-edit .upload-btn:hover{ color: var(--fg); background: var(--bg-raised); }
  .team-avatar-edit input[type="file"]{ position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .team-editor .field-group.compact{ gap: 5px; }
  .team-member-controls{
    display: flex;
    gap: 8px;
  }
  .team-member-controls input{
    flex: 1;
    min-width: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13px;
  }
  .team-member-controls button,
  .team-actions button{
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--fg);
    padding: 8px 10px;
    font-size: 12px;
  }
  .team-member-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 24px;
  }
  .team-member-tag{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 6px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--fg-dim);
  }
  .team-member-tag button{
    border: none;
    background: transparent;
    color: var(--fg-dim);
    padding: 0;
    font-size: 12px;
    cursor: pointer;
  }
  .team-actions{
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .team-toolbar{
    border-bottom: 1px solid var(--border-soft);
    padding: 10px 16px 12px;
    background: rgba(255,255,255,0.01);
  }
  .team-toolbar.hidden{ display: none; }
  .team-member-inline{ display: flex; gap: 8px; }
  .team-member-inline input{
    flex: 1;
    min-width: 0;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .team-member-inline button{
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--fg);
    border-radius: 9px;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .team-delete-btn{
    border: 1px solid var(--error) !important;
    color: var(--error) !important;
    background: rgba(255,138,122,0.05) !important;
  }
  .team-item{
    margin-bottom: 6px;
  }
  .team-btn{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    background: none;
    border: none;
    border-radius: 11px;
    text-align: left;
    transition: 0.15s;
  }
  .team-btn:hover{ background: var(--bg-hover); }
  .team-btn[aria-current="true"]{ background: var(--bg-raised); }
  .team-meta{ flex: 1; min-width: 0; }
  .team-name{ font-size: 13.5px; font-weight: 600; display: block; }
  .team-sub{ font-size: 11.5px; color: var(--fg-dim); display: block; margin-top: 2px; }
  .team-empty{ color: var(--fg-faint); font-size: 12px; padding: 8px 2px; }

  .contact-list{
    list-style: none;
    margin: 0; padding: 6px;
    overflow-y: auto;
    flex: 1;
  }

  .contact-item{ margin-bottom: 2px; }
  .contact-btn{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 10px;
    background: none;
    border: none;
    border-radius: 11px;
    text-align: left;
    transition: 0.15s;
  }
  .contact-btn:hover{ background: var(--bg-hover); }
  .contact-btn[aria-current="true"]{ background: var(--bg-raised); }

  .contact-meta{ flex: 1; min-width: 0; }
  .contact-top-row{ display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .contact-name{ font-size: 14px; font-weight: 600; }
  .contact-time{ font-size: 11px; color: var(--fg-faint); flex-shrink: 0; }
  .contact-bottom-row{ display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 2px; }
  .contact-preview{
    font-size: 12.5px; color: var(--fg-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .unread-badge{
    flex-shrink: 0;
    min-width: 18px; height: 18px;
    border-radius: 9px;
    background: var(--unread);
    color: #000;
    font-size: 10.5px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0 5px;
  }

  .verified-icon{
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
    margin-left: 3px;
  }
  .verified-icon svg{ width: 14px; height: 14px; display: block; }

  .empty-contacts{
    padding: 30px 20px;
    text-align: center;
    color: var(--fg-faint);
    font-size: 13px;
  }

  /* ---------- CHAT PANEL ---------- */
  .chat-panel{
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--bg);
  }

  .chat-header{
    flex-shrink: 0;
    height: 62px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border-soft);
  }
  .chat-header .back-btn{ display: none; }
  .chat-header .who{ display: flex; flex-direction: column; min-width: 0; }
  .chat-header .who .name{ font-size: 14.5px; font-weight: 600; }
  .chat-header .who .status{ font-size: 11.5px; color: var(--fg-dim); }
  .chat-header .who .status.online{ color: var(--online); }

  .messages{
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }

  .date-divider{
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--fg-faint);
    font-size: 11.5px;
    margin: 18px 0 10px;
  }
  .date-divider::before, .date-divider::after{
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-soft);
  }
  .date-divider:first-child{ margin-top: 0; }

  .msg-row{
    display: flex;
    margin-bottom: 4px;
  }
  .msg-avatar{ width: 36px; height: 36px; border-radius: 50%; overflow: hidden; margin-right: 10px; flex-shrink:0; background:#1c1c19; display:flex; align-items:center; justify-content:center; }
  .msg-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .msg-row.in{ justify-content: flex-start; }
  .msg-row.out{ justify-content: flex-end; }

  .msg-col{ display: flex; flex-direction: column; max-width: 74%; }
  .msg-row.out .msg-col{ align-items: flex-end; }
  .msg-row.in .msg-col{ align-items: flex-start; }

  .bubble{
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg-row.in .bubble{
    background: #1a1a17;
    border: 1px solid var(--border-soft);
    border-bottom-left-radius: 4px;
  }
  .msg-row.out .bubble{
    background: var(--fg);
    color: #000;
    border-bottom-right-radius: 4px;
  }
  .msg-row.out .bubble.failed{
    background: var(--bg-card);
    color: var(--error);
    border: 1px solid var(--error);
  }

  .msg-time{
    font-size: 10.5px;
    color: var(--fg-faint);
    margin: 3px 3px 0;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .typing-row{
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: #1a1a17;
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
    margin-top: 6px;
  }
  .typing-row .td{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--fg-dim);
    animation: yapa-bounce 1.1s infinite ease-in-out;
  }
  .typing-row .td:nth-child(2){ animation-delay: 0.15s; }
  .typing-row .td:nth-child(3){ animation-delay: 0.3s; }
  @keyframes yapa-bounce{
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- COMPOSER ---------- */
  .composer{
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border-soft);
  }
  .composer textarea{
    flex: 1;
    resize: none;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 14.5px;
    line-height: 1.4;
    max-height: 140px;
    min-height: 42px;
  }
  .composer textarea::placeholder{ color: var(--fg-faint); }
  .send-btn{
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--fg);
    border: none;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: 0.18s;
  }
  .send-btn:hover{ transform: translateY(-2px); }
  .send-btn:disabled{ opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg{ width: 17px; height: 17px; }

  /* ---------- TOAST ---------- */
  .toast{
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(10px);
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--fg);
    font-size: 13px;
    padding: 11px 18px;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 200;
    max-width: 90vw;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error{ border-color: var(--error); color: var(--error); }

  /* ---------- PROFILE DRAWER ---------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 90;
  }
  .overlay.show{ opacity: 1; pointer-events: auto; }

  .drawer{
    position: fixed;
    top: 0; right: 0;
    height: 100%;
    width: 380px;
    max-width: 92vw;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.28s ease;
    z-index: 95;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .drawer.show{ transform: translateX(0); }

  .drawer-header{
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border-soft);
  }
  .drawer-header h2{ font-size: 17px; font-weight: 700; }

  .drawer-body{ padding: 22px 20px; display: flex; flex-direction: column; gap: 22px; flex: 1; }

  .avatar-edit{ display: flex; align-items: center; gap: 16px; }
  .avatar-edit .avatar{ width: 64px; height: 64px; font-size: 20px; }
  .avatar-edit label.upload-btn{
    font-size: 13px;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    color: var(--fg-dim);
    transition: 0.18s;
    display: inline-block;
  }
  .avatar-edit label.upload-btn:hover{ color: var(--fg); background: var(--bg-raised); }
  .avatar-edit input[type="file"]{ position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  .field-group{ display: flex; flex-direction: column; gap: 7px; }
  .field-group label{
    font-size: 12px; color: var(--fg-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .field-group input{
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 13px;
    font-size: 14px;
  }

  .save-btn{
    padding: 12px 0;
    background: var(--fg);
    color: #000;
    border: none;
    border-radius: 9px;
    font-weight: 600;
    font-size: 14px;
    transition: 0.18s;
  }
  .save-btn:hover{ transform: translateY(-2px); }

  .drawer-divider{ height: 1px; background: var(--border-soft); margin: 4px 0; }

  .danger-zone{ display: flex; flex-direction: column; gap: 10px; }
  .danger-zone .label{ font-size: 12px; color: var(--fg-faint); }
  .ghost-btn{
    padding: 11px 0;
    background: none;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 13.5px;
    color: var(--fg-dim);
    transition: 0.18s;
  }
  .ghost-btn:hover{ background: var(--bg-raised); color: var(--fg); }
  .danger-btn{
    padding: 11px 0;
    background: none;
    border: 1px solid var(--error);
    border-radius: 9px;
    font-size: 13.5px;
    color: var(--error);
    transition: 0.18s;
  }
  .danger-btn:hover{ background: rgba(255,138,122,0.08); }

  /* ---------- CONFIRM MODAL ---------- */
  .confirm-modal{
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }
  .confirm-modal.show{ display: flex; }
  .confirm-modal .backdrop{
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.65);
  }
  .confirm-box{
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6);
  }
  .confirm-box h3{ font-size: 16px; margin-bottom: 8px; }
  .confirm-box p{ font-size: 13.5px; color: var(--fg-dim); margin-bottom: 20px; }
  .confirm-actions{ display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-actions button{
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    border: 1px solid var(--border);
    background: none;
    color: var(--fg);
  }
  .confirm-actions .confirm-danger{ background: var(--error); color: #1a0000; border-color: var(--error); font-weight: 600; }

  /* ---------- MOBILE ---------- */
  @media (max-width: 780px){
    .hamburger{ display: flex; }

    .sidebar{
      position: fixed;
      top: 60px; left: 0; bottom: 0;
      width: 86vw;
      max-width: 340px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 80;
      box-shadow: 20px 0 50px rgba(0,0,0,0.5);
    }
    .sidebar.show{ transform: translateX(0); }

    .sidebar-scrim{
      display: none;
      position: fixed;
      top: 60px; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 75;
    }
    .sidebar-scrim.show{ display: block; }

    .chat-header .back-btn{ display: flex; }
    .drawer{ width: 100vw; max-width: none; }
    .msg-col{ max-width: 86%; }
  }

  @media (min-width: 781px){
    .chat-header .back-btn{ display: none !important; }
  }
</style>
</head>
<body>

<div class="yapa-app" id="yapaApp">

  <!-- ================= HEADER ================= -->
  <header class="app-header">
    <div class="left">
      <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="Show contacts" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="website.html">
        <div class="logo-mark">
          <svg viewBox="0 0 100 100" fill="none">
            <path d="M28 24 L50 50 L72 24" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M50 50 L50 78" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="wordmark">Yapa</span>
      </a>
    </div>

    <button class="header-user" id="profileOpenBtn" aria-haspopup="dialog" aria-controls="profileDrawer">
      <div>
        <div class="name" id="headerUserName">You</div>
        <div class="role">View profile</div>
      </div>
      <div class="avatar sm" id="headerAvatar" aria-hidden="true">Y</div>
    </button>
  </header>

  <!-- ================= MAIN ================= -->
  <div class="app-main">

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- CONTACTS SIDEBAR -->
    <nav class="sidebar" id="sidebar" aria-label="Contacts">
      <div class="sidebar-search">
        <div class="find-row">
          <label for="contactSearch" class="sr-only">Search contacts</label>
          <input type="text" id="contactSearch" placeholder="Search contacts…" autocomplete="off">
          <button type="button" class="find-btn" id="findUserBtn" style="background: var(--bg-card); border: 1px solid var(--border);">🔍︎</button>
        </div>
      </div>

      <ul class="contact-list" id="contactList" role="list" aria-label="Conversations"></ul>
    </nav>

    <!-- CHAT PANEL -->
    <main class="chat-panel" id="chatPanel">

      <div class="chat-header" id="chatHeader" hidden>
        <button class="icon-btn back-btn" id="backBtn" aria-label="Back to contacts">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="avatar" id="chatAvatar" aria-hidden="true"></div>
        <div class="who">
          <span class="name" id="chatContactName"></span>
          <span class="status mono" id="chatContactStatus"></span>
        </div>
      </div>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation" hidden></div>

      <form class="composer" id="composer" hidden>
        <label for="messageInput" class="sr-only">Message</label>
        <textarea id="messageInput" rows="1" placeholder="Message…" aria-label="Type a message"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="#000"/></svg>
        </button>
      </form>

    </main>
  </div>

  <!-- ================= PROFILE DRAWER ================= -->
  <div class="overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="profileDrawer" role="dialog" aria-modal="true" aria-labelledby="profileDrawerTitle" hidden>
    <div class="drawer-header">
      <h2 id="profileDrawerTitle">Your profile</h2>
      <button class="icon-btn" id="profileCloseBtn" aria-label="Close profile">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <form id="profileForm">
        <div class="avatar-edit">
          <div class="avatar" id="drawerAvatarPreview" aria-hidden="true">Y</div>
          <label class="upload-btn" for="avatarFileInput">Change photo</label>
          <input type="file" id="avatarFileInput" accept="image/*">
        </div>

        <div class="field-group" style="margin-top:20px;">
          <label for="displayNameInput">Display name</label>
          <input type="text" id="displayNameInput" autocomplete="name">
        </div>

        <button type="submit" class="save-btn" style="margin-top:16px; width:100%; color: black;">Save changes</button>
      </form>

      <div class="drawer-divider"></div>

      <div class="danger-zone">
        <span class="label mono">SESSION</span>
        <button type="button" class="ghost-btn" id="logoutBtn">Log out</button>
      </div>

      <div class="danger-zone">
        <span class="label mono">DANGER ZONE</span>
        <button type="button" class="danger-btn" id="deleteAccountBtn">Delete account</button>
      </div>
    </div>
  </aside>

  <!-- ================= CONFIRM MODAL ================= -->
  <div class="confirm-modal" id="confirmModal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <div class="backdrop" id="confirmBackdrop"></div>
    <div class="confirm-box">
      <h3 id="confirmTitle">Delete your account?</h3>
      <p id="confirmDesc">This permanently deletes your account and messages. This can't be undone.</p>
      <div class="confirm-actions">
        <button type="button" id="confirmCancelBtn">Cancel</button>
        <button type="button" class="confirm-danger" id="confirmDeleteBtn">Delete account</button>
      </div>
    </div>
  </div>

  <!-- ================= TOAST ================= -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</div>

<script>
(function(){
  "use strict";

  /* ================================================================
     CONFIG — change these to match your backend.
     ================================================================ */
  var CONFIG = {
    API_BASE: "",                       // e.g. "https://api.yapa.app" — leave "" for same-origin
    ENDPOINTS: {
      contacts:      "/api/contacts",
      messages:      "/api/messages",   // GET ?contactId=..., POST { to, text }
      profile:       "/api/profile",    // POST { username, avatarBase64 }
      profileDelete: "/api/profile/delete",
      logout:        "/api/logout",
      markRead:      "/api/contacts/mark_read",
      usersSearch:   "/api/users/search",
      typing:        "/api/typing"
    },
    LOGIN_URL: "/login",                // redirect target after logout. Use "auth.html" for this project's local login page.
    FETCH_TIMEOUT_MS: 6000,
    // Polling interval (ms) for refreshing contacts and messages.
    POLL_INTERVAL_MS: 2000
  };

  /* ================================================================
     SEED DATA — used only when the API is unreachable and
     localStorage is empty (first run / offline demo).
     ================================================================ */
  // No embedded demo data — the app fetches live data from the server.
  // If the server is unreachable, the UI falls back to empty local state.

  /* ================================================================
     STATE
     ================================================================ */
  var state = {
    contacts: [],
    teams: [],
    messagesByContact: {},   // { contactId: [messages] }
    activeContactId: null,
    profile: null,
    typingContactId: null
  };

  // Module-level typing flag. Must live out here (not inside init()) because
  // stopTyping() is also defined at this scope and needs to read/write it —
  // previously it was declared with `var` inside init(), so stopTyping()'s
  // assignment threw a ReferenceError under "use strict" any time a message
  // was sent (it silently aborted the .then() chain after sending).
  var isTyping = false;

  var AUTH_TOKEN = (function(){ try { return localStorage.getItem('yapa_auth_token') || ''; } catch(e){ return ''; } })();
  var CURRENT_USER = (function(){ try { return sessionStorage.getItem('yapa_username'); } catch(e){ return null; } })();

  function clearAuthSession(){
    try {
      localStorage.removeItem('yapa_auth_token');
      sessionStorage.clear();
      Object.keys(localStorage).forEach(function(key){ if (key.indexOf('yapa_') === 0) localStorage.removeItem(key); });
    } catch (e) {}
  }

  if (!CURRENT_USER && AUTH_TOKEN) {
    fetchWithTimeout(apiUrl('/api/remember'), {
      headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
    }).then(function(res){ return res.json(); }).then(function(data){
      if (data && data.success && data.username) {
        CURRENT_USER = data.username;
        try { sessionStorage.setItem('yapa_username', CURRENT_USER); } catch(e){}
      } else {
        clearAuthSession();
        window.location.href = CONFIG.LOGIN_URL;
      }
    }).catch(function(){
      clearAuthSession();
      window.location.href = CONFIG.LOGIN_URL;
    });
  }

  if (!CURRENT_USER && !AUTH_TOKEN) {
    window.location.href = CONFIG.LOGIN_URL;
  }

  /* ================================================================
     DOM REFS
     ================================================================ */
  var $ = function(id){ return document.getElementById(id); };

  var sidebar = $("sidebar"), sidebarScrim = $("sidebarScrim"), hamburgerBtn = $("hamburgerBtn");
  var contactList = $("contactList"), contactSearch = $("contactSearch"), findUserBtn = $("findUserBtn");
  var chatHeader = $("chatHeader"), chatAvatar = $("chatAvatar"), chatContactName = $("chatContactName"), chatContactStatus = $("chatContactStatus");
  var messagesEl = $("messages");
  var composer = $("composer"), messageInput = $("messageInput"), sendBtn = $("sendBtn");
  var backBtn = $("backBtn");
  var headerUserName = $("headerUserName"), headerAvatar = $("headerAvatar");
  var profileOpenBtn = $("profileOpenBtn"), profileCloseBtn = $("profileCloseBtn"), profileDrawer = $("profileDrawer"), drawerOverlay = $("drawerOverlay");
  var profileForm = $("profileForm"), displayNameInput = $("displayNameInput"), avatarFileInput = $("avatarFileInput"), drawerAvatarPreview = $("drawerAvatarPreview");
  var logoutBtn = $("logoutBtn"), deleteAccountBtn = $("deleteAccountBtn");
  var confirmModal = $("confirmModal"), confirmBackdrop = $("confirmBackdrop"), confirmCancelBtn = $("confirmCancelBtn"), confirmDeleteBtn = $("confirmDeleteBtn");
  var toastEl = $("toast");

  var pendingAvatarBase64 = null;
  var lastFocusedEl = null;

  /* ================================================================
     UTILITIES
     ================================================================ */
  function toast(msg, isError){
    toastEl.textContent = msg;
    toastEl.classList.toggle("error", !!isError);
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 3200);
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function initials(name){
    if(!name) return "?";
    var parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }

  function fetchWithTimeout(url, opts){
    opts = opts || {};
    var token = AUTH_TOKEN || ((function(){ try { return localStorage.getItem('yapa_auth_token') || ''; } catch(e){ return ''; } })());
    opts.headers = Object.assign({}, opts.headers || {});
    if (token && !opts.headers.Authorization) {
      opts.headers.Authorization = 'Bearer ' + token;
    }
    var controller = ("AbortController" in window) ? new AbortController() : null;
    if (controller) opts.signal = controller.signal;
    var timeoutId = controller ? setTimeout(function(){ controller.abort(); }, CONFIG.FETCH_TIMEOUT_MS) : null;
    return fetch(url, opts).finally(function(){ if (timeoutId) clearTimeout(timeoutId); });
  }

  function apiUrl(path){ return CONFIG.API_BASE + path; }

  // Human-friendly relative/date labels.
  function formatClockTime(iso){
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function formatListTime(iso){
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var now = new Date();
    var isToday = d.toDateString() === now.toDateString();
    if (isToday) return formatClockTime(iso);
    var diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
    if (diffDays === 1) return "Yesterday";
    if (diffDays < 7) return d.toLocaleDateString(undefined, { weekday: "short" });
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }

  function dateDividerLabel(iso){
    var d = new Date(iso);
    var now = new Date();
    var diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
    if (diffDays === 0) return "Today";
    if (diffDays === 1) return "Yesterday";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: (d.getFullYear() !== now.getFullYear() ? "numeric" : undefined) });
  }

  /* ================================================================
     LOCAL STORAGE FALLBACK LAYER
     ================================================================ */
  var LS_KEYS = {
    contacts: "yapa_contacts",
    messages: function(id){ return "yapa_messages_" + id; },
    profile: "yapa_profile"
  };

  function lsGetContacts(){
    var raw = localStorage.getItem(LS_KEYS.contacts);
    if (raw) { try { return JSON.parse(raw); } catch(e){} }
    return [];
  }
  function lsSetContacts(contacts){ localStorage.setItem(LS_KEYS.contacts, JSON.stringify(contacts)); }

  function lsGetMessages(contactId){
    var key = LS_KEYS.messages(contactId);
    var raw = localStorage.getItem(key);
    if (raw) { try { return JSON.parse(raw); } catch(e){} }
    return [];
  }
  function lsSetMessages(contactId, msgs){ localStorage.setItem(LS_KEYS.messages(contactId), JSON.stringify(msgs)); }

  function clearLocalUserState(){
    try {
      Object.keys(localStorage).forEach(function(key){
        if (key.indexOf('yapa_') === 0) localStorage.removeItem(key);
      });
    } catch (e) {}
  }

  function normalizeTeamMemberHandle(memberName){
    if (!memberName) return '';
    var value = String(memberName).trim();
    if (!value) return '';
    if (value.charAt(0) === '@') value = value.slice(1).trim();
    return value;
  }

  function teamIncludesCurrentUser(team){
    if (!team || !CURRENT_USER) return false;
    var members = Array.isArray(team.members) ? team.members : [];
    var current = normalizeTeamMemberHandle(CURRENT_USER).toLowerCase();
    if (team.owner && normalizeTeamMemberHandle(team.owner).toLowerCase() === current) return true;
    return members.some(function(member){
      return normalizeTeamMemberHandle(member).toLowerCase() === current;
    });
  }

  function loadTeams(){
    try {
      var raw = localStorage.getItem('yapa_teams');
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveTeams(){
    try {
      localStorage.setItem('yapa_teams', JSON.stringify(state.teams));
    } catch (e) {}
  }

  function lsGetTeamMessages(teamId){
    try {
      var raw = localStorage.getItem('yapa_team_messages_' + teamId);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function lsSetTeamMessages(teamId, msgs){
    try {
      localStorage.setItem('yapa_team_messages_' + teamId, JSON.stringify(msgs));
    } catch (e) {}
  }

  function lsGetProfile(){
    var raw = localStorage.getItem(LS_KEYS.profile);
    var fallback = { username: CURRENT_USER || "", email: "", avatarBase64: "" };
    if (raw) {
      try {
        var stored = JSON.parse(raw);
        if (stored && typeof stored === 'object') {
          var currentUsername = CURRENT_USER || stored.username || "";
          var profile = {
            username: currentUsername,
            email: stored.email || "",
            avatarBase64: stored.avatarBase64 || stored.avatar || ""
          };
          if (stored.username && CURRENT_USER && stored.username !== CURRENT_USER) {
            profile.username = CURRENT_USER;
            profile.email = "";
            profile.avatarBase64 = "";
          }
          localStorage.setItem(LS_KEYS.profile, JSON.stringify(profile));
          return profile;
        }
      } catch(e){}
    }
    localStorage.setItem(LS_KEYS.profile, JSON.stringify(fallback));
    return fallback;
  }
  function lsSetProfile(profile){ localStorage.setItem(LS_KEYS.profile, JSON.stringify(profile)); }

  /* ================================================================
     DATA LAYER — tries the REST API first, gracefully falls back
     to localStorage on network error / 404 / non-OK response.
     ================================================================ */
  function loadContacts(){
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.contacts) + "?username=" + encodeURIComponent(CURRENT_USER))
      .then(function(res){
        if (!res.ok) throw new Error("bad status " + res.status);
        return res.json();
      })
      .then(function(data){
        // endpoint returns { success: true, contacts: [...] }
        if (data && Array.isArray(data.contacts)) return data.contacts;
        if (Array.isArray(data)) return data; // legacy
        throw new Error("bad shape");
      })
      .catch(function(){
        return lsGetContacts();
      });
  }

  function fetchProfile(username){
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.profile) + "?username=" + encodeURIComponent(username))
      .then(function(res){ if (!res.ok) throw new Error('bad'); return res.json(); })
      .then(function(data){
        if (data && data.user) {
          return {
            username: data.user.username || username,
            email: data.user.email || "",
            avatarBase64: data.user.avatarBase64 || data.user.avatar || ""
          };
        }
        throw new Error('bad');
      })
      .catch(function(){ return null; });
  }

  function searchUsers(q){
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.usersSearch) + "?q=" + encodeURIComponent(q) + "&currentUser=" + encodeURIComponent(CURRENT_USER || ''))
      .then(function(res){ if (!res.ok) throw new Error('bad'); return res.json(); })
      .then(function(data){ if (data && Array.isArray(data.users)) return data.users; throw new Error('bad shape'); })
      .catch(function(){ return []; });
  }

  function addContactByUsername(username){
    return fetchWithTimeout(apiUrl('/api/contacts/add'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: CURRENT_USER, contact: username })
    }).then(function(res){ if (!res.ok) throw new Error('bad'); return res.json(); });
  }

  function loadMessages(contactId){
    if (contactId && String(contactId).indexOf('team:') === 0) {
      return Promise.resolve(lsGetTeamMessages(contactId));
    }
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.messages) + "?contactId=" + encodeURIComponent(contactId) + "&username=" + encodeURIComponent(CURRENT_USER))
      .then(function(res){
        if (!res.ok) throw new Error("bad status " + res.status);
        return res.json();
      })
      .then(function(data){
        // endpoint returns { success: true, messages: [...] }
        if (data && Array.isArray(data.messages)) return data.messages;
        if (Array.isArray(data)) return data;
        throw new Error("bad shape");
      })
      .catch(function(){
        return lsGetMessages(contactId);
      });
  }

  function markRead(contactId){
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.markRead), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: CURRENT_USER, contactId: contactId })
    }).catch(function(){ /* ignore network errors */ });
  }

  function sendMessage(contactId, contactName, text){
    if (contactId && String(contactId).indexOf('team:') === 0) {
      var teamId = contactId;
      var team = state.teams.find(function(item){ return item.id === teamId; });
      var localMsg = {
        id: 'team-' + Date.now(),
        from: CURRENT_USER,
        to: teamId,
        text: text,
        isoTime: new Date().toISOString()
      };
      var msgs = lsGetTeamMessages(teamId);
      msgs.push(localMsg);
      lsSetTeamMessages(teamId, msgs);
      state.messagesByContact[teamId] = msgs;
      if (team) {
        team.lastMessage = text;
        team.lastTime = localMsg.isoTime;
        saveTeams();
      }
      renderTeams();
      return Promise.resolve(localMsg);
    }

    var body = { from: CURRENT_USER, to: contactId, text: text };
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.messages), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function(res){
        if (!res.ok) throw new Error("bad status " + res.status);
        return res.json();
      })
      .catch(function(err){
        // Network error or non-OK response — fall back to local persistence.
        // Only surface a toast for reachable-but-failing servers, not for the
        // expected "no backend configured" offline case.
        return null;
      });
  }

  function stopTyping(){
    if (!state.activeContactId) return;
    fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.typing), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: CURRENT_USER, to: state.activeContactId, action: 'stop' })
    }).catch(function(){});
    isTyping = false;
  }

  function saveProfile(profile){
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.profile), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(profile)
    })
      .then(function(res){
        if (!res.ok) throw new Error("bad status " + res.status);
        return res.json().catch(function(){ return profile; });
      })
      .catch(function(){
        lsSetProfile(profile);
        return profile;
      });
  }

  function deleteAccountRequest(){
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.profileDelete), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: CURRENT_USER })
    })
      .then(function(res){ return res.ok; })
      .catch(function(){ return false; });
  }

  function logoutRequest(){
    return fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.logout), { method: "POST" })
      .then(function(res){ return res.ok; })
      .catch(function(){ return false; });
  }

  /* ================================================================
     RENDER: CONTACTS
     ================================================================ */
  function renderTeams(){
    return;
  }

      var nameHtml = '<span class="contact-name">' + escapeHtml(c.name) + verifiedBadge + '</span>';

  /* ================================================================
     RENDER: MESSAGES
     ================================================================ */
  function renderMessages(contactId){
    var msgs = (state.messagesByContact[contactId] || []).slice()
      .sort(function(a,b){ return new Date(a.isoTime) - new Date(b.isoTime); });

    messagesEl.innerHTML = "";

    var lastDateKey = null;
    msgs.forEach(function(m){
      var d = new Date(m.isoTime);
      var dateKey = d.toDateString();
      if (dateKey !== lastDateKey) {
        var div = document.createElement("div");
        div.className = "date-divider mono";
        div.textContent = dateDividerLabel(m.isoTime);
        messagesEl.appendChild(div);
        lastDateKey = dateKey;
      }
      messagesEl.appendChild(renderMessageRow(m));
    });

    maybeScrollToBottom(true);
  }

  function renderMessageRow(m){
    var isOut = m.from === CURRENT_USER;
    var row = document.createElement("div");
    row.className = "msg-row " + (isOut ? "out" : "in");
    row.dataset.id = m.id;

    var col = document.createElement("div");
    col.className = "msg-col";

    var bubble = document.createElement("div");
    bubble.className = "bubble" + (m.status === "failed" ? " failed" : "");
    bubble.textContent = m.text;

    // message rows display only bubbles; avatars are shown in the contacts list

    var srLabel = document.createElement("span");
    srLabel.className = "sr-only";
    srLabel.textContent = "Message from " + (isOut ? "you" : m.from) + ", " + formatClockTime(m.isoTime) + ": " + m.text;
    bubble.prepend(srLabel);

    var time = document.createElement("div");
    time.className = "msg-time mono";
    var statusText = "";
    if (isOut) {
      if (m.status === "sending") statusText = "Sending…";
      else if (m.status === "failed") statusText = "Failed to send";
      else statusText = "Sent";
    }
    time.textContent = formatClockTime(m.isoTime) + (statusText ? " · " + statusText : "");

    col.appendChild(bubble);
    col.appendChild(time);
    row.appendChild(col);
    return row;
  }

  function isNearBottom(){
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
  }

  function maybeScrollToBottom(force){
    if (force || isNearBottom()) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  function showTyping(show){
    var existing = document.getElementById("typingRow");
    if (existing) existing.remove();
    if (show) {
      var who = typeof show === 'string' ? show : null;
      var row = document.createElement("div");
      row.className = "typing-row";
      row.id = "typingRow";
      row.setAttribute("aria-label", (who ? who + ' is typing' : 'Contact is typing'));
      row.innerHTML = '<div class="typing-meta">' + (who ? escapeHtml(who) + ' is typing' : '') + '</div>' + '<span class="td"></span><span class="td"></span><span class="td"></span>';
      messagesEl.appendChild(row);
      maybeScrollToBottom(true);
    }
  }

  /* ================================================================
     CONTACT SELECTION
     ================================================================ */
  function openContact(contactId){
    state.activeContactId = contactId;
    var contact = state.contacts.find(function(c){ return c.id === contactId; });
    if (!contact) return;

    // Mark as read locally (no dedicated "mark read" endpoint in spec).
    if (contact.unread) {
      contact.unread = 0;
      persistContacts();
    }

    renderContacts(contactSearch.value);

    chatHeader.hidden = false;
    messagesEl.hidden = false;
    composer.hidden = false;

    chatContactName.textContent = contact.name;
    chatContactStatus.textContent = contact.online ? "online" : "offline";
    chatContactStatus.classList.toggle("online", !!contact.online);
    chatAvatar.className = "avatar" + (contact.online ? " online" : "");
    chatAvatar.innerHTML = contact.avatarUrl
      ? '<img src="' + escapeHtml(contact.avatarUrl) + '" alt="">'
      : initials(contact.name);

    // Fetch the contact's profile once and reuse it both to populate their
    // avatar in the contact list and (previously, redundantly) fetched a
    // second time just for the avatar. profile.avatarBase64 is the field the
    // /api/profile endpoint actually returns (there is no `.avatar` field),
    // so this also fixes contact avatars never loading.
    if (!state.messagesByContact[contactId]) {
      loadMessages(contactId).then(function(msgs){
        state.messagesByContact[contactId] = msgs;
        renderMessages(contactId);
        markRead(contactId);
      });
    } else {
      renderMessages(contactId);
      markRead(contactId);
    }

    if (!contact.avatarUrl) {
      fetchProfile(contactId).then(function(profile){
        if (profile && profile.avatarBase64) {
          contact.avatarUrl = profile.avatarBase64;
          renderContacts(contactSearch.value);
          if (state.activeContactId === contactId) {
            chatAvatar.innerHTML = '<img src="' + escapeHtml(contact.avatarUrl) + '" alt="">';
          }
        }
      });
    }

    closeSidebarOnMobile();
    messageInput.focus();
  }

  function openTeam(teamId){
    state.activeContactId = teamId;
    var team = state.teams.find(function(item){ return item.id === teamId; });
    if (!team) return;

    renderTeams();
    chatHeader.hidden = false;
    messagesEl.hidden = false;
    composer.hidden = false;

    chatContactName.textContent = team.name || 'Team chat';
    chatContactStatus.textContent = (team.members || []).length + ' members';
    chatContactStatus.classList.toggle('online', false);
    chatAvatar.className = 'avatar';
    chatAvatar.innerHTML = team.avatarUrl
      ? '<img src="' + escapeHtml(team.avatarUrl) + '" alt="">'
      : initials(team.name || 'T');

    state.messagesByContact[teamId] = state.messagesByContact[teamId] || lsGetTeamMessages(teamId);
    renderMessages(teamId);
    closeSidebarOnMobile();
    messageInput.focus();
  }

  function persistContacts(){
    lsSetContacts(state.contacts);
    // Best-effort — no dedicated "update contact" endpoint in spec,
    // so this is intentionally local-only.
  }

  /* ================================================================
     SENDING MESSAGES
     ================================================================ */
  function handleSend(e){
    e.preventDefault();
    var text = messageInput.value.trim();
    if (!text || !state.activeContactId) return;

    var contactId = state.activeContactId;
    var contact = state.contacts.find(function(c){ return c.id === contactId; });

    if (String(contactId).indexOf('team:') === 0) {
      var team = state.teams.find(function(item){ return item.id === contactId; });
      var teamMsg = {
        id: 'team-' + Date.now(),
        from: CURRENT_USER,
        to: contactId,
        text: text,
        isoTime: new Date().toISOString()
      };
      state.messagesByContact[contactId] = state.messagesByContact[contactId] || lsGetTeamMessages(contactId);
      state.messagesByContact[contactId].push(teamMsg);
      lsSetTeamMessages(contactId, state.messagesByContact[contactId]);
      if (team) {
        team.lastMessage = text;
        team.lastTime = teamMsg.isoTime;
        saveTeams();
        renderTeams();
      }
      renderMessages(contactId);
      messageInput.value = "";
      autoGrow(messageInput);
      updateSendBtnState();
      return;
    }

    var tempId = "temp-" + Date.now();
    var optimisticMsg = {
      id: tempId,
      from: CURRENT_USER,
      to: contact ? contact.name : "",
      text: text,
      isoTime: new Date().toISOString(),
      status: "sending"
    };

    state.messagesByContact[contactId] = state.messagesByContact[contactId] || [];
    state.messagesByContact[contactId].push(optimisticMsg);
    renderMessages(contactId);

    // Update contact preview immediately.
    if (contact) {
      contact.lastMessage = text;
      contact.lastTime = optimisticMsg.isoTime;
      persistContacts();
      renderContacts(contactSearch.value);
    }

    messageInput.value = "";
    autoGrow(messageInput);
    updateSendBtnState();

    sendMessage(contactId, contact ? contact.name : "", text).then(function(saved){
      var msgs = state.messagesByContact[contactId];
      var idx = msgs.findIndex(function(m){ return m.id === tempId; });
      if (idx === -1) return;
      if (saved && saved.message) {
        // server returns { success: true, message: {...} }
        msgs[idx] = Object.assign({}, saved.message, { status: "sent" });
      } else if (saved && saved.id) {
        msgs[idx] = Object.assign({}, saved, { status: "sent" });
      } else {
        // fallback: mark as sent and persist locally
        msgs[idx] = Object.assign({}, optimisticMsg, { status: "sent" });
      }
      lsSetMessages(contactId, msgs);
      renderMessages(contactId);
      // stop typing when message sent
      stopTyping();
    });
  }

  // Real-time behavior is implemented via polling (see POLL_INTERVAL_MS).

  function autoGrow(el){
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 140) + "px";
  }

  function updateSendBtnState(){
    sendBtn.disabled = messageInput.value.trim().length === 0;
  }

  /* ================================================================
     SIDEBAR (MOBILE) TOGGLE
     ================================================================ */
  function openSidebar(){
    sidebar.classList.add("show");
    sidebarScrim.classList.add("show");
    hamburgerBtn.setAttribute("aria-expanded", "true");
  }
  function closeSidebar(){
    sidebar.classList.remove("show");
    sidebarScrim.classList.remove("show");
    hamburgerBtn.setAttribute("aria-expanded", "false");
  }
  function closeSidebarOnMobile(){
    if (window.innerWidth <= 780) closeSidebar();
  }

  /* ================================================================
     PROFILE DRAWER
     ================================================================ */
  function openProfileDrawer(){
    lastFocusedEl = document.activeElement;
    profileDrawer.hidden = false;
    requestAnimationFrame(function(){
      profileDrawer.classList.add("show");
      drawerOverlay.classList.add("show");
    });
    displayNameInput.value = state.profile.username || "";
    displayNameInput.focus();
    document.addEventListener("keydown", onDrawerKeydown);
  }
  function closeProfileDrawer(){
    profileDrawer.classList.remove("show");
    drawerOverlay.classList.remove("show");
    document.removeEventListener("keydown", onDrawerKeydown);
    setTimeout(function(){ profileDrawer.hidden = true; }, 280);
    if (lastFocusedEl) lastFocusedEl.focus();
  }
  function onDrawerKeydown(e){
    if (e.key === "Escape") closeProfileDrawer();
  }

  function resizeImageToBase64(file, maxSize, callback){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement("canvas");
        var scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setAvatarPreview(el, dataUrl, name){
    if (dataUrl) {
      el.innerHTML = '<img src="' + dataUrl + '" alt="">';
    } else {
      el.textContent = initials(name);
    }
  }

  /* ================================================================
     CONFIRM MODAL (used for destructive actions)
     ================================================================ */
  var confirmResolver = null;
  function askConfirm(title, desc, confirmLabel){
    $("confirmTitle").textContent = title;
    $("confirmDesc").textContent = desc;
    confirmDeleteBtn.textContent = confirmLabel || "Confirm";
    confirmModal.classList.add("show");
    confirmDeleteBtn.focus();
    return new Promise(function(resolve){ confirmResolver = resolve; });
  }
  function closeConfirm(result){
    confirmModal.classList.remove("show");
    if (confirmResolver) { confirmResolver(result); confirmResolver = null; }
  }

  /* ================================================================
     INIT
     ================================================================ */
  function init(){
    // Header hamburger
    hamburgerBtn.addEventListener("click", function(){
      sidebar.classList.contains("show") ? closeSidebar() : openSidebar();
    });
    sidebarScrim.addEventListener("click", closeSidebar);
    backBtn.addEventListener("click", closeSidebar);

    state.teams = loadTeams();

    // Contact search
    contactSearch.addEventListener("input", function(){ renderContacts(contactSearch.value); });

    function performUserSearch(){
      var q = contactSearch.value.trim();
      if (!q) {
        toast('Enter a username or @handle to search.', true);
        return;
      }
      var normalized = q.charAt(0) === '@' ? q.slice(1).trim() : q;
      if (!/^[A-Za-z0-9](?:[A-Za-z0-9._]*[A-Za-z0-9])?$/.test(normalized)) {
        toast('Invalid handle. Use letters, numbers, underscores, and periods only.', true);
        return;
      }
      searchUsers(q).then(function(results){
        if (!results || !results.length) {
          toast('No user found for that handle.', true);
          return;
        }
        var user = results[0];
        if (user.username === CURRENT_USER) {
          toast('You cannot add yourself as a contact.', true);
          return;
        }
        var existing = state.contacts.find(function(c){ return c.id === user.username; });
        if (!existing) {
          addContactByUsername(user.username).then(function(){
            loadContacts().then(function(contacts){
              state.contacts = contacts || [];
              renderContacts("");
              var added = state.contacts.find(function(c){ return c.id === user.username; });
              if (added) openContact(added.id);
            });
          }).catch(function(){
            toast('Could not add contact right now.', true);
          });
        } else {
          openContact(existing.id);
        }
      });
    }

    contactSearch.addEventListener("keydown", function(e){ if (e.key === 'Enter') { e.preventDefault(); performUserSearch(); } });
    findUserBtn.addEventListener("click", performUserSearch);

    // Composer
    composer.addEventListener("submit", handleSend);

    // Auto-grow / send-button state + typing notifications are combined into
    // a single "input" listener below (they were previously two separate
    // listeners doing overlapping work).
    var typingTimer = null;
    function sendTypingStart(){
      if (!state.activeContactId || isTyping) return;
      isTyping = true;
      fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.typing), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: CURRENT_USER, to: state.activeContactId, action: 'start' })
      }).catch(function(){});
    }
    messageInput.addEventListener("input", function(){
      autoGrow(messageInput);
      updateSendBtnState();
      if (typingTimer) clearTimeout(typingTimer);
      sendTypingStart();
      typingTimer = setTimeout(function(){ stopTyping(); typingTimer = null; }, 2000);
    });
    messageInput.addEventListener("keydown", function(e){
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) composer.dispatchEvent(new Event("submit", { cancelable: true }));
      }
    });

    // Profile drawer
    profileOpenBtn.addEventListener("click", openProfileDrawer);
    profileCloseBtn.addEventListener("click", closeProfileDrawer);
    drawerOverlay.addEventListener("click", closeProfileDrawer);

    avatarFileInput.addEventListener("change", function(){
      var file = avatarFileInput.files && avatarFileInput.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) { toast("Please choose an image file.", true); return; }
      resizeImageToBase64(file, 256, function(dataUrl){
        pendingAvatarBase64 = dataUrl;
        setAvatarPreview(drawerAvatarPreview, dataUrl, displayNameInput.value);
      });
    });

    profileForm.addEventListener("submit", function(e){
      e.preventDefault();
      var newName = displayNameInput.value.trim();
      if (!newName) { toast("Display name can't be empty.", true); return; }

      var updated = Object.assign({}, state.profile, {
        username: newName,
        avatarBase64: pendingAvatarBase64 || state.profile.avatarBase64 || ""
      });

      saveProfile(updated).then(function(saved){
        state.profile = Object.assign({}, updated, saved || {});
        lsSetProfile(state.profile);
        applyProfileToHeader();
        // The pending upload has now been persisted into state.profile —
        // clear it so a later drawer open doesn't silently resend a stale
        // pending avatar if the user opens the drawer without picking a
        // new photo.
        pendingAvatarBase64 = null;
        // ensure drawer avatar initials are black when saved (no image)
        setAvatarPreview(drawerAvatarPreview, state.profile.avatarBase64, state.profile.username);
        if (!state.profile.avatarBase64) {
          try { drawerAvatarPreview.style.color = '#000'; } catch(e){}
        } else {
          try { drawerAvatarPreview.style.color = ''; } catch(e){}
        }
        toast("Profile updated.");
      });
    });

    // Logout
    logoutBtn.addEventListener("click", function(){
      logoutRequest().finally(function(){
        clearAuthSession();
        toast("Logged out.");
        setTimeout(function(){ window.location.href = CONFIG.LOGIN_URL; }, 400);
      });
    });

    // Delete account
    deleteAccountBtn.addEventListener("click", function(){
      askConfirm(
        "Delete your account?",
        "This permanently deletes your account and messages. This can't be undone.",
        "Delete account"
      ).then(function(confirmed){
        if (!confirmed) return;
        deleteAccountRequest().finally(function(){
          try {
            Object.keys(localStorage).forEach(function(k){
              if (k.indexOf("yapa_") === 0) localStorage.removeItem(k);
            });
          } catch(e){}
          toast("Account deleted.");
          setTimeout(function(){ window.location.href = CONFIG.LOGIN_URL; }, 500);
        });
      });
    });

    confirmCancelBtn.addEventListener("click", function(){ closeConfirm(false); });
    confirmBackdrop.addEventListener("click", function(){ closeConfirm(false); });
    confirmDeleteBtn.addEventListener("click", function(){ closeConfirm(true); });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && confirmModal.classList.contains("show")) closeConfirm(false);
    });

    // Load the current user's profile from the server if available, otherwise fall back to local storage.
    fetchProfile(CURRENT_USER).then(function(profile){
      if (profile) {
        state.profile = profile;
        lsSetProfile(profile);
      } else {
        state.profile = lsGetProfile();
      }
      applyProfileToHeader();
    }).catch(function(){
      state.profile = lsGetProfile();
      applyProfileToHeader();
    });

    // Load contacts, then default-select the first one on wider screens.
    loadContacts().then(function(contacts){
      state.contacts = contacts || [];
      // fetch missing avatars for contacts (server returns `avatarBase64`, not `avatar`)
      var toFetch = state.contacts.filter(function(c){ return !c.avatarUrl && c.id; }).map(function(c){ return fetchProfile(c.id).then(function(p){ if (p && p.avatarBase64) c.avatarUrl = p.avatarBase64; }).catch(function(){}); });
      Promise.all(toFetch).finally(function(){
        renderContacts("");
            if (window.innerWidth > 780 && state.contacts.length) {
          openContact(state.contacts[0].id);
        } else {
          messagesEl.hidden = false;
          composer.hidden = false;
          messagesEl.innerHTML = "";
        }
      });
    });

    // Poll for updates (contacts + messages for active conversation)
    setInterval(function(){
      loadContacts().then(function(contacts){ state.contacts = contacts || []; renderContacts(contactSearch.value); });
      renderTeams();
      if (state.activeContactId) {
        if (String(state.activeContactId).indexOf('team:') === 0) {
          var teamMsgs = lsGetTeamMessages(state.activeContactId);
          state.messagesByContact[state.activeContactId] = teamMsgs;
          renderMessages(state.activeContactId);
        } else {
          loadMessages(state.activeContactId).then(function(msgs){ state.messagesByContact[state.activeContactId] = msgs || []; renderMessages(state.activeContactId); markRead(state.activeContactId); });
          // check typing status
          fetchWithTimeout(apiUrl(CONFIG.ENDPOINTS.typing) + '?username=' + encodeURIComponent(CURRENT_USER) + '&contactId=' + encodeURIComponent(state.activeContactId))
            .then(function(res){ if (!res.ok) throw new Error('bad'); return res.json(); })
            .then(function(t){ if (t && t.typing) showTyping(t.who); else showTyping(false); })
            .catch(function(){ showTyping(false); });
        }
      }
    }, CONFIG.POLL_INTERVAL_MS);
  }

  function applyProfileToHeader(){
    headerUserName.textContent = state.profile.username || "You";
    setAvatarPreview(headerAvatar, state.profile.avatarBase64, state.profile.username);
    setAvatarPreview(drawerAvatarPreview, state.profile.avatarBase64, state.profile.username);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>

</body>
</html>
